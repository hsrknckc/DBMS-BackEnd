spring.application.name=dbms_backend

# --- Ara katman baglanti ayarlari ---
# Ister_0001 geregi koda gomulu degil: ara katman baska bir makineye tasinirsa
# sadece bu satirlar degisir, Java kodu ayni kalir.
#
# AWS EC2'deki ortak ara katman sunucusu:
middleware.host=${MIDDLEWARE_HOST:63.182.79.25:5150}
middleware.port=${MIDDLEWARE_PORT:5150}
#
# Yerel sahte ara katmanla calismak icin (./gradlew :backend-lib:runMockServer):
#   MIDDLEWARE_HOST=localhost degeriyle calistirin.

# Bu API uygulamasinin ara katmana kendini tanittigi kullanici.
# DIKKAT: username tam e-posta olmali, kisa ad kabul edilmiyor -> UNAUTHORIZED.
#
# GUVENLIK: Gercek sifre BURAYA (git'e giden bir dosyaya) YAZILMAZ - bu depo
# herkese acik. Deger MIDDLEWARE_USER / MIDDLEWARE_PASSWORD ortam
# degiskenlerinden okunur; hicbiri ayarlanmazsa uygulama acilista acik bir
# hatayla durur (sessizce yanlis/eksik kimlikle baglanmaz).
#
# Gercek degerleri nasil saklayacagini set-credentials.sh.example dosyasinda
# anlatiyoruz.
middleware.username=${MIDDLEWARE_USER}
middleware.password=${MIDDLEWARE_PASSWORD}

# HealthMonitor kac milisaniyede bir ping atsin (Ister_0018)
middleware.health-check-interval-ms=5000
