// ÖRNEK API UYGULAMASI
// Arka Yüz kütüphanesinin "API uygulamalarında kullanılması" isterini
// (doküman 1.2.3) gösteren küçük Spring Boot REST uygulaması.
plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'dbms_backend demo API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Asıl iş yapan kütüphanemiz — MongoDB'ye ara katman üzerinden erişir
    implementation project(':backend-lib')

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
